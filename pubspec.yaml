name: freq_fit
description: A thoughtful workspace for exploratory hearing checks.
publish_to: 'none'
version: 2.0.0+2
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Blinker
      fonts:
        - asset: assets/fonts/Blinker-Regular.ttf
          weight: 400
        - asset: assets/fonts/Blinker-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Blinker-Bold.ttf
          weight: 700
